<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Форма</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <main class="page">
      <form class="form">
        <h1>Связаться с нами</h1>
        <label class="field">
          <span>Имя</span>
          <input
            type="text"
            name="name"
            placeholder="Ваше имя" 
            required />
        </label>
        <label class="field">
          <span>Email</span>
          <input
            type="email"
            name="email"
            placeholder="name@example.com" 
            required />
        </label>
        <label class="field">
          <span>Сообщение</span>
          <textarea
            name="message"
            placeholder="Напишите сообщение"
            required
          ></textarea>
        </label>
        <label class="check">
          <input type="checkbox" name="agree" required />
          <span>Я согласен на обработку данных</span>
        </label>
        <button type="submit">Отправить</button>
        <button  ty="button" disabled>Недоступная кнопка</button>
      </form>
    </main>
  </body>
</html>
